<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Game Boy Emulator",
        "url": "https://gb.builtbyzee.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (browser)",
        "browserRequirements": "Requires WebAssembly support",
        "author": { "@type": "Person", "name": "zeejfps" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #081820;
        color: #e0f8d0;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        overscroll-behavior: none;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      footer {
        font-size: 12px;
        opacity: 0.6;
        text-align: center;
        padding: 12px 16px;
      }
      canvas {
        width: 640px;
        height: 576px;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        background: #081820;
        display: block;
      }
      input[type="file"] {
        color: inherit;
      }

      /* Desktop default: pages flatten via display:contents so the picker DOM
         (h1 + file input) and the game DOM (canvas) coexist in <main>'s flex
         column exactly as the original single-view layout. */
      #page-picker, #page-game {
        display: contents;
      }
      .game-left, .game-right, .rom-cta {
        display: none;
      }

      /* ----- Touch / small-screen mode ----- */
      @media (max-width: 720px), (pointer: coarse) {
        main {
          max-width: 100%;
          padding: 0;
          gap: 0;
        }
        /* Pages become real pages; .hidden now actually hides one. */
        #page-picker, #page-game {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
          box-sizing: border-box;
        }
        #page-picker.hidden, #page-game.hidden {
          display: none !important;
        }

        /* Picker page: centered h1 + big load button, native input visually hidden. */
        #page-picker {
          min-height: 100vh;
          justify-content: center;
          gap: 32px;
          padding: 16px;
        }
        #page-picker input[type="file"] {
          position: absolute;
          width: 1px;
          height: 1px;
          opacity: 0;
          pointer-events: none;
        }
        .rom-cta {
          display: inline-block;
          padding: 16px 32px;
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          border-radius: 12px;
          font-size: 18px;
          font-weight: 600;
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
          touch-action: manipulation;
        }

        /* Shared touch-button styles. */
        .dpad, .ab {
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
        }
        .dpad button,
        .ab button {
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          padding: 0;
          touch-action: none;
          transition: background 60ms linear, transform 60ms linear;
        }
        .dpad button.pressed,
        .dpad button:active,
        .ab button.pressed,
        .ab button:active {
          background: #e0f8d0;
          color: #081820;
          transform: scale(0.94);
        }
        .dpad {
          position: relative;
          width: 150px;
          height: 150px;
        }
        .dpad button {
          position: absolute;
          width: 50px;
          height: 50px;
          font-size: 20px;
        }
        .dpad .up    { top: 0;    left: 50px; }
        .dpad .down  { top: 100px; left: 50px; }
        .dpad .left  { top: 50px; left: 0; }
        .dpad .right { top: 50px; left: 100px; }
        .ab {
          position: relative;
          width: 150px;
          height: 150px;
        }
        .ab button {
          position: absolute;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          font-size: 22px;
          font-weight: 700;
        }
        .ab .b { top: 60px; left: 0; }
        .ab .a { top: 20px; left: 80px; }
        .ab .ab-combo {
          width: 50px;
          height: 50px;
          top: 90px;
          left: 70px;
          font-size: 14px;
          letter-spacing: 0.5px;
        }
        .ss-pill {
          display: flex;
          align-items: stretch;
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          border-radius: 14px;
          overflow: hidden;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          font-size: 11px;
          letter-spacing: 0.5px;
        }
        .ss-half {
          padding: 6px 18px;
          text-align: center;
          transition: background 60ms linear, color 60ms linear;
        }
        .ss-half.ss-left { border-right: 2px solid #e0f8d0; }
        .ss-half.pressed {
          background: #e0f8d0;
          color: #081820;
        }
        .power-btn {
          display: inline-block;
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          font-size: 18px;
          line-height: 1;
          padding: 0;
          cursor: pointer;
          touch-action: manipulation;
          transition: background 60ms linear, transform 60ms linear;
        }
        .power-btn:active {
          background: #e0f8d0;
          color: #081820;
          transform: scale(0.94);
        }
      }

      /* Touch portrait: canvas full-width on top; dpad+ab in a row; pill then
         power-off below. Side wrappers collapse via display:contents so their
         children become direct grid items of #page-game. */
      @media (max-width: 720px) and (orientation: portrait),
             (pointer: coarse) and (orientation: portrait) {
        #page-game {
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-template-areas:
            "canvas canvas"
            "dpad   ab"
            "pill   power";
          align-items: center;
          width: 100%;
          gap: 12px;
          padding: 12px 0;
        }
        .game-left, .game-right {
          display: contents;
        }
        #page-game canvas {
          grid-area: canvas;
          width: 100vw;
          height: calc(100vw * 144 / 160);
          max-width: 100vw;
        }
        #page-game .dpad {
          grid-area: dpad;
          justify-self: start;
          margin-left: 16px;
        }
        #page-game .ab {
          grid-area: ab;
          justify-self: end;
          margin-right: 16px;
        }
        #page-game .ss-pill {
          grid-area: pill;
          justify-self: center;
        }
        #page-game .power-btn {
          grid-area: power;
          justify-self: end;
          margin-right: 16px;
        }
      }

      /* Touch landscape: dpad + power-off + pill on the left, canvas centered
         and height-locked, A/B diamond on the right. Side wrappers are flex
         columns so DOM order (dpad → power → pill) flows naturally. */
      @media (max-width: 720px) and (orientation: landscape),
             (pointer: coarse) and (orientation: landscape) {
        #page-game {
          display: grid;
          grid-template-columns: 160px 1fr 160px;
          align-items: center;
          height: 100vh;
          width: 100vw;
          padding: 0;
          gap: 0;
        }
        #page-game canvas {
          grid-column: 2;
          height: min(calc(100vh - 16px), calc((100vw - 320px) * 144 / 160));
          aspect-ratio: 160 / 144;
          width: auto;
          margin: 0 auto;
        }
        /* DOM order is [dpad, pill] / [ab, power]. column-reverse + space-between
           anchors gameplay controls (dpad, A/B) to the bottom corners and the
           rarely-used controls (pill, ⏻) to the top corners. */
        .game-left {
          grid-column: 1;
          display: flex;
          flex-direction: column-reverse;
          align-items: center;
          justify-content: space-between;
          height: 100%;
          padding: 12px 0;
          box-sizing: border-box;
        }
        .game-right {
          grid-column: 3;
          display: flex;
          flex-direction: column-reverse;
          align-items: center;
          justify-content: space-between;
          height: 100%;
          padding: 12px 0;
          box-sizing: border-box;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="page-picker">
        <h1>GameBoy Emulator</h1>
        <label class="rom-cta" for="rom">Load .gb ROM</label>
        <input id="rom" type="file" accept=".gb" />
      </div>

      <div id="page-game" class="hidden">
        <div class="game-left">
          <div class="dpad">
            <button data-btn="Up" class="up" aria-label="Up">▲</button>
            <button data-btn="Down" class="down" aria-label="Down">▼</button>
            <button data-btn="Left" class="left" aria-label="Left">◀</button>
            <button data-btn="Right" class="right" aria-label="Right">▶</button>
          </div>
          <div class="ss-pill" id="ss-pill" role="group" aria-label="Select and Start">
            <span class="ss-half ss-left" aria-label="Select">SEL</span>
            <span class="ss-half ss-right" aria-label="Start">STA</span>
          </div>
        </div>
        <canvas id="screen" width="160" height="144"></canvas>
        <div class="game-right">
          <div class="ab">
            <button data-btn="B" class="b" aria-label="B">B</button>
            <button data-btn="A" class="a" aria-label="A">A</button>
            <button data-combo="AB" class="ab-combo" aria-label="A and B together">A+B</button>
          </div>
          <button id="power-off" class="power-btn" aria-label="Power off" type="button">⏻</button>
        </div>
      </div>
    </main>
    <footer>version <span id="version">dev</span></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
