    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Game Boy Emulator",

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #081820;
        color: #e0f8d0;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        overscroll-behavior: none;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      canvas {
        width: 640px;
        height: 576px;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        background: #081820;
        display: block;
      }
      input[type="file"] {
        color: inherit;
      }
      #touch-controls {
        display: none;
      }
      @media (max-width: 720px), (pointer: coarse) {
        main {
          padding: 12px 0;
          gap: 12px;
        }
        canvas {
          width: 100vw;
          height: calc(100vw * 144 / 160);
          max-width: 100vw;
        }
        #touch-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;
          padding: 16px;
          box-sizing: border-box;
          gap: 16px;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
        }
        .dpad {
          position: relative;
          width: 150px;
          height: 150px;
          justify-self: start;
        }
        .dpad button {
          position: absolute;
          width: 50px;
          height: 50px;
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          font-size: 20px;
          padding: 0;
          touch-action: none;
        }
        .dpad button:active { background: #88c070; }
        .dpad .up    { top: 0;    left: 50px; }
        .dpad .down  { top: 100px; left: 50px; }
        .dpad .left  { top: 50px; left: 0; }
        .dpad .right { top: 50px; left: 100px; }
        .ab {
          position: relative;
          width: 150px;
          height: 150px;
          justify-self: end;
        }
        .ab button {
          position: absolute;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          font-size: 22px;
          font-weight: 700;
          padding: 0;
          touch-action: none;
        }
        .ab button:active { background: #88c070; }
        .ab .b { top: 60px; left: 0; }
        .ab .a { top: 20px; left: 80px; }
        .start-select {
          grid-column: 1 / -1;
          display: flex;
          justify-content: center;
          gap: 24px;
        }
        .start-select button {
          background: #346856;
          border: 2px solid #e0f8d0;
          color: #e0f8d0;
          padding: 8px 20px;
          font-size: 13px;
          letter-spacing: 1px;
          border-radius: 16px;
          touch-action: none;
        }
        .start-select button:active { background: #88c070; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GameBoy Emulator</h1>
      <input id="rom" type="file" accept=".gb" />
      <canvas id="screen" width="160" height="144"></canvas>
      <div id="touch-controls">
        <div class="dpad">
          <button data-btn="Up" class="up" aria-label="Up">▲</button>
          <button data-btn="Down" class="down" aria-label="Down">▼</button>
          <button data-btn="Left" class="left" aria-label="Left">◀</button>
          <button data-btn="Right" class="right" aria-label="Right">▶</button>
        </div>
        <div class="ab">
          <button data-btn="B" class="b" aria-label="B">B</button>
          <button data-btn="A" class="a" aria-label="A">A</button>
        </div>
        <div class="start-select">
          <button data-btn="Select" aria-label="Select">SELECT</button>
          <button data-btn="Start" aria-label="Start">START</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
